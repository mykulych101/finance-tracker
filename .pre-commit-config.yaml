repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^frontend/src/redux/api\.ts$
      - id: end-of-file-fixer
        exclude: ^(backend/config/static/vendor/.*|docs/coverage\.svg)$
      - id: check-yaml
        exclude: ^docker/mkdocs/mkdocs\.yml$
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        files: ^backend/.*\.py$
      - id: ruff-format
        args: [--check]
        files: ^backend/.*\.py$

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        language: node
        entry: bash -c 'cd frontend && yarn lint'
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
